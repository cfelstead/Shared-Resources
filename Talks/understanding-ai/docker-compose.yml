services:
  ollama:
    build:
      context: .
      dockerfile: docker/Dockerfile.ollama
    image: understanding-ai-ollama:latest
    container_name: understanding-ai-ollama
    tty: true
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  ollama-data:
